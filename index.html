<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naim Kirana Store - Admin Panel</title>

    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="container">

    <h1>Admin Panel</h1>

    <form id="productForm">

        <input type="text" id="name_en" placeholder="Product Name (English)" required>

        <input type="text" id="name_hi" placeholder="Product Name (Hindi)" required>

        <input type="text" id="name_mr" placeholder="Product Name (Marathi)" required>

        <input type="number" id="price" placeholder="Price" required>

        <input type="file" id="image" accept="image/*">

        <button type="submit">
            Add Product
        </button>

    </form>

    <hr>

    <div id="productList"></div>

</div>

<script src="../firebase-config.js"></script>
<script src="../firebase.js"></script>
<script src="admin.js"></script>

</body>
</html><!-- LANGUAGE SWITCH -->
