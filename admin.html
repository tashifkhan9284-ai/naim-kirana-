<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel V2 - Naim Kirana</title>

<style>
body { font-family: Arial; background:#f5f5f5; padding:15px; }
.box { max-width:420px; margin:auto; background:white; padding:15px; border-radius:10px; }
input, button { width:100%; padding:10px; margin-top:10px; }
button { background:green; color:white; border:none; }
.product { background:#fff; padding:10px; margin-top:10px; border-radius:10px; }
img { width:100%; border-radius:10px; }
</style>

</head>

<body>

<div class="box">

<h2>🔐 Admin Login</h2>

<div id="loginBox">
<input type="password" id="pass" placeholder="Enter Password">
<button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none;">

<h3>➕ Add Product (with Photo Upload)</h3>

<input type="text" id="name" placeholder="Product Name">
<input type="text" id="price" placeholder="Price">

<input type="file" id="imgFile" accept="image/*">

<button onclick="addProduct()">Add Product</button>

<h3>📦 Products</h3>
<div id="list"></div>

</div>

</div>

<script>

let PASSWORD = "1234";

function login(){
let p = document.getElementById("pass").value;
if(p === PASSWORD){
document.getElementById("loginBox").style.display="none";
document.getElementById("panel").style.display="block";
load();
}else{
alert("Wrong Password");
}
}

// Convert image to Base64
function toBase64(file){
return new Promise((resolve,reject)=>{
let reader = new FileReader();
reader.readAsDataURL(file);
reader.onload = ()=>resolve(reader.result);
reader.onerror = error=>reject(error);
});
}

async function addProduct(){

let name = document.getElementById("name").value;
let price = document.getElementById("price").value;
let file = document.getElementById("imgFile").files[0];

if(!file){
alert("Select image first");
return;
}

let img = await toBase64(file);

let data = JSON.parse(localStorage.getItem("products") || "[]");

data.push({
name:name,
price:price,
img:img
});

localStorage.setItem("products", JSON.stringify(data));

load();
}

function load(){
let list = document.getElementById("list");
list.innerHTML="";

let data = JSON.parse(localStorage.getItem("products") || "[]");

data.forEach((p,i)=>{
list.innerHTML += `
<div class="product">
<img src="${p.img}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
<button onclick="del(${i})">Delete</button>
</div>
`;
});
}

function del(i){
let data = JSON.parse(localStorage.getItem("products") || "[]");
data.splice(i,1);
localStorage.setItem("products", JSON.stringify(data));
load();
}

</script>

</body>
</html>
