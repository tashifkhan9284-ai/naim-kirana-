<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Naim Kirana Admin</title>
<style>
body { font-family: Arial; background:#f2f2f2; padding:20px; }
.box { background:white; padding:15px; border-radius:10px; max-width:400px; margin:auto; }
input, button {
width:100%; padding:10px; margin-top:10px;
}
button { background:green; color:white; border:none; }
.product { background:white; padding:10px; margin-top:10px; border-radius:10px; }
</style>
</head>
<body>

<div class="box">
<h2>🔐 Admin Login</h2>

<div id="login">
<input type="password" id="pass" placeholder="Enter Password">
<button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none;">
<h3>➕ Add Product</h3>

<input type="text" id="name" placeholder="Product Name">
<input type="text" id="price" placeholder="Price">
<input type="text" id="img" placeholder="Image URL">

<button onclick="addProduct()">Add</button>

<h3>📦 Products</h3>
<div id="list"></div>
</div>

</div>

<script>
let PASSWORD = "1234";

function login(){
let p = document.getElementById("pass").value;
if(p === PASSWORD){
document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";
load();
}else{
alert("Wrong Password");
}
}

function addProduct(){
let name = document.getElementById("name").value;
let price = document.getElementById("price").value;
let img = document.getElementById("img").value;

let data = JSON.parse(localStorage.getItem("products") || "[]");
data.push({name, price, img});
localStorage.setItem("products", JSON.stringify(data));

load();
}

function load(){
let list = document.getElementById("list");
list.innerHTML = "";

let data = JSON.parse(localStorage.getItem("products") || "[]");

data.forEach((p,i)=>{
list.innerHTML += `
<div class="product">
<img src="${p.img}" width="100%">
<h4>${p.name}</h4>
<p>₹${p.price}</p>
<button onclick="del(${i})">Delete</button>
</div>
`;
});
}

function del(i){
let data = JSON.parse(localStorage.getItem("products") || "[]");
data.splice(i,1);
localStorage.setItem("products", JSON.stringify(data));
load();
}
</script>

</body>
</html>
